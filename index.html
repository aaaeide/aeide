<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/face_with_cowboy_hat.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andreas' lille hjørne av verdensveven</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
          Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background-color: black;
        color: white;
      }

      main {
        border: 1px solid orange;
        padding: 1em;
        max-width: 400px;
      }

      a {
        color: orange;
      }

      hr {
        border: none;
        border-top: 1px solid orange;
      }

      h1 {
        font-family: monospace;
        border-right: 0.15em solid orange;
        white-space: nowrap;
        width: min-content;
        animation: blink-caret 1s step-end infinite;
      }

      h1::before {
        content: " ";
        display: inline-block;
        width: 0em;
      }

      @keyframes blink-caret {
        from,
        to {
          border-color: transparent;
        }
        50% {
          border-color: orange;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="typo"></h1>
      <div id="content"></div>
    </main>

    <script>
      let title = "Andreas Aaberge Eide";
      const el = document.getElementById("typo");
      let chars = [];

      function next(i) {
        chars = [...chars, title[i]];
        el.textContent = chars.join("");

        if (i < title.length - 1) {
          let ms = (title[i] == " " ? 1000 : 200) * (0.5 + Math.random());
          setTimeout(() => next(i + 1), ms);
        } else {
          setTimeout(() => prev(i), 3000);
        }
      }

      function prev(i) {
        chars.pop();
        el.textContent = chars.join("");

        if (i > 0) {
          let ms = 125 + 50 * -Math.random();
          setTimeout(() => prev(i - 1), ms);
        } else {
          title = addTypo(title);
          setTimeout(() => next(i), 1500);
        }
      }

      function addTypo(txt) {
        let randIdx = (len) => Math.floor(Math.random() * len);
        let i = randIdx(txt.length - 1);

        txt = txt.slice(0, i) + txt[i + 1] + txt[i] + txt.slice(i + 2);

        txt = txt
          .split(" ")
          .map((wd) => wd.toLowerCase())
          .map((wd) => wd.charAt(0).toUpperCase() + wd.slice(1))
          .join(" ");

        return txt;
      }

      next(0);

      const esc = (s) =>
        s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      const inline = (s) =>
        esc(s)
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");

      function mdToHtml(md) {
        return md
          .split(/\n\s*\n/)
          .map((block) => {
            block = block.trim();
            if (!block) return "";
            if (/^-{3,}$/.test(block)) return "<hr />";
            let m = block.match(/^(#{1,3})\s+(.*)$/);
            if (m)
              return "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">";
            return "<p>" + inline(block) + "</p>";
          })
          .join("\n");
      }

      fetch("index.md")
        .then((r) => r.text())
        .then((md) => {
          document.getElementById("content").innerHTML = mdToHtml(md);
        })
        .catch(() => {
          document.getElementById("content").textContent =
            "Kunne ikke laste innholdet.";
        });
    </script>
  </body>
</html>
